<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Penerima Kode Email (Temp Mail)</title>
    <!-- Menggunakan Tailwind CSS untuk tampilan yang rapi -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white shadow-xl rounded-2xl p-6 w-full max-w-xl">
        <h1 class="text-2xl font-bold text-slate-800 mb-2 text-center">Inbox Email Sementara</h1>
        <p class="text-sm text-slate-500 mb-6 text-center">Gunakan alamat email di bawah ini untuk menerima kode verifikasi.</p>

        <!-- Bagian Alamat Email -->
        <div class="mb-6">
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Alamat Email Anda:</label>
            <div class="flex gap-2">
                <input type="text" id="emailAddress" readonly class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2 text-slate-700 font-mono text-sm focus:outline-none">
                <button onclick="copyEmail()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition">Salin</button>
                <button onclick="generateEmail()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-4 py-2 rounded-lg text-sm transition" title="Ganti Email">🔄</button>
            </div>
        </div>

        <!-- Tombol Refresh & Status -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold text-slate-700">Kotak Masuk (Inbox)</h2>
            <button onclick="checkInbox()" id="refreshBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-3 py-1.5 rounded-lg transition">Cek Pesan Baru</button>
        </div>

        <!-- Daftar Pesan Masuk -->
        <div id="inboxList" class="space-y-3 max-h-60 overflow-y-auto mb-4 border border-slate-200 rounded-lg p-3 bg-slate-50">
            <p class="text-sm text-slate-400 text-center py-6">Belum ada email masuk...</p>
        </div>

        <!-- Detail Pesan -->
        <div id="messageDetail" class="hidden border-t border-slate-200 pt-4 mt-4">
            <div class="flex justify-between items-center mb-2">
                <h3 id="msgSubject" class="font-bold text-slate-800 text-base"></h3>
                <button onclick="closeMessage()" class="text-xs text-red-500 hover:underline">Tutup Pesan</button>
            </div>
            <p class="text-xs text-slate-500 mb-2">Dari: <span id="msgFrom"></span></p>
            <div id="msgBody" class="bg-white border border-slate-200 p-4 rounded-lg text-sm text-slate-700 overflow-x-auto"></div>
        </div>
    </div>

    <!-- JavaScript untuk logika aplikasi -->
    <script>
        let currentEmail = "";
        let currentLogin = "";
        let currentDomain = "";

        // Daftar domain aktif dari 1SecMail API
        const domains = ["1secmail.com", "1secmail.org", "1secmail.net", "wwjmp.com", "esiix.com"];

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateRandomString(length) {
            const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
            let result = "";
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Membuat email acak baru
        function generateEmail() {
            currentLogin = generateRandomString(10);
            currentDomain = getRandomItem(domains);
            currentEmail = `${currentLogin}@${currentDomain}`;
            
            document.getElementById("emailAddress").value = currentEmail;
            document.getElementById("inboxList").innerHTML = `<p class="text-sm text-slate-400 text-center py-6">Belum ada email masuk...</p>`;
            closeMessage();
        }

        // Menyalin email ke clipboard
        function copyEmail() {
            const emailInput = document.getElementById("emailAddress");
            emailInput.select();
            navigator.clipboard.writeText(emailInput.value);
            alert("Email berhasil disalin!");
        }

        // Mengecek kotak masuk (Inbox)
        async function checkInbox() {
            if (!currentLogin) return;
            const btn = document.getElementById("refreshBtn");
            btn.innerText = "Memeriksa...";

            try {
                let response = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${currentLogin}&domain=${currentDomain}`);
                let messages = await response.json();

                let inboxList = document.getElementById("inboxList");
                inboxList.innerHTML = "";

                if (messages.length === 0) {
                    inboxList.innerHTML = `<p class="text-sm text-slate-400 text-center py-6">Belum ada email masuk...</p>`;
                } else {
                    messages.forEach(msg => {
                        let item = document.createElement("div");
                        item.className = "bg-white border border-slate-200 p-3 rounded-lg shadow-sm hover:bg-blue-50 cursor-pointer transition flex justify-between items-center";
                        item.innerHTML = `
                            <div>
                                <p class="font-semibold text-slate-800 text-sm">${msg.from}</p>
                                <p class="text-xs text-slate-600">${msg.subject}</p>
                            </div>
                            <span class="text-xs text-slate-400">${msg.date}</span>
                        `;
                        item.onclick = () => readMessage(msg.id);
                        inboxList.appendChild(item);
                    });
                }
            } catch (error) {
                console.error("Gagal mengambil pesan:", error);
            } finally {
                btn.innerText = "Cek Pesan Baru";
            }
        }

        // Membaca isi detail email tertentu
        async function readMessage(id) {
            try {
                let response = await fetch(`https://www.1secmail.com/api/v1/?action=readMessage&login=${currentLogin}&domain=${currentDomain}&id=${id}`);
                let data = await response.json();

                document.getElementById("msgSubject").innerText = data.subject;
                document.getElementById("msgFrom").innerText = data.from;
                
                // Menampilkan isi email (bisa berupa HTML atau teks biasa)
                let bodyDiv = document.getElementById("msgBody");
                if (data.htmlBody) {
                    bodyDiv.innerHTML = data.htmlBody;
                } else {
                    bodyDiv.innerText = data.textBody;
                }

                document.getElementById("messageDetail").classList.remove("hidden");
            } catch (error) {
                console.error("Gagal membaca pesan:", error);
            }
        }

        function closeMessage() {
            document.getElementById("messageDetail").classList.add("hidden");
            document.getElementById("msgBody").innerHTML = "";
        }

        // Generate email saat halaman pertama kali dibuka
        window.onload = generateEmail;

        // Otomatis cek pesan baru setiap 10 detik
        setInterval(checkInbox, 10000);
    </script>
</body>
</html>
