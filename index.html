<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sakti</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-slate-900 border border-slate-800 shadow-2xl shadow-purple-500/10 rounded-2xl p-6 w-full max-w-xl">
        <!-- Judul Header -->
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 mb-1 text-center tracking-wide">EMAIL SAKTI</h1>
        <p class="text-xs text-slate-400 mb-6 text-center">Layanan kotak masuk domain <span class="text-cyan-400 font-mono">josjisbos.my.id</span></p>

        <!-- Bagian Alamat Email -->
        <div class="mb-6">
            <label class="block text-xs font-bold text-pink-400 uppercase mb-2 tracking-wider">Alamat Email Anda:</label>
            <div class="flex gap-2 mb-3">
                <input type="text" id="targetEmail" readonly class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-cyan-300 font-mono text-sm focus:outline-none">
                <button onclick="copyEmail()" id="copyEmailBtn" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold px-4 py-2 rounded-lg text-sm transition shadow-lg shadow-blue-500/20 whitespace-nowrap">Salin</button>
            </div>
            <!-- Tombol Pilihan Generator: Nama & String -->
            <div class="flex gap-2">
                <button onclick="generateEmail('name')" class="flex-1 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-semibold py-2 rounded-lg text-sm transition shadow-lg shadow-purple-500/20">👤 Nama</button>
                <button onclick="generateEmail('string')" class="flex-1 bg-gradient-to-r from-cyan-600 to-teal-600 hover:from-cyan-500 hover:to-teal-500 text-white font-semibold py-2 rounded-lg text-sm transition shadow-lg shadow-cyan-500/20">🔣 String</button>
            </div>
        </div>

        <!-- Tombol Refresh & Status -->
        <div class="flex justify-between items-center mb-4 border-t border-slate-800 pt-4">
            <h2 class="text-md font-bold text-yellow-400">Kotak Masuk (Inbox)</h2>
            <button onclick="fetchInbox()" id="refreshBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow-md shadow-emerald-600/20">Cek Pesan Baru</button>
        </div>

        <!-- Daftar Pesan Masuk -->
        <div id="inboxList" class="space-y-3 max-h-72 overflow-y-auto mb-2 border border-slate-800 rounded-lg p-3 bg-slate-950/50">
            <p class="text-sm text-slate-500 text-center py-6">Belum ada email masuk...</p>
        </div>
    </div>

    <!-- JavaScript Logika -->
    <script>
        const SUPABASE_URL = "https://leozcdtoagbxuhefypjh.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxlb3pjZHRvYWdieHVoZWZ5cGpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTI3OTUsImV4cCI6MjEwNzAyODc5NX0.W8Gm7H-lQ9CbcvhiZXjV6RK1uNbrKMRgrwDdtda5dgI";

        const DOMAIN = "josjisbos.my.id";
        let currentEmail = "";

        const firstNames = ["budi", "siti", "joko", "dewi", "agus", "ani", "eko", "sri", "rizky", "putri", "bayu", "indah", "dimas", "fitri"];

        function generateRandomString(length) {
            const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
            let result = "";
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Generator tipe: 'name' (Nama + Angka) atau 'string' (Huruf Angka Acak)
        function generateEmail(type) {
            let prefix = "";
            if (type === 'name') {
                const randomName = firstNames[Math.floor(Math.random() * firstNames.length)];
                const randomNum = Math.floor(Math.random() * 900) + 100; // Angka 3 digit
                prefix = `${randomName}${randomNum}`;
            } else {
                prefix = generateRandomString(8);
            }

            currentEmail = `${prefix}@${DOMAIN}`;
            document.getElementById("targetEmail").value = currentEmail;
            document.getElementById("inboxList").innerHTML = `<p class="text-sm text-slate-500 text-center py-6">Belum ada email masuk...</p>`;
            
            fetchInbox();
        }

        // Menyalin email tanpa Pop-up alert (mengubah teks tombol sementara)
        function copyEmail() {
            const emailInput = document.getElementById("targetEmail");
            navigator.clipboard.writeText(emailInput.value);
            
            const btn = document.getElementById("copyEmailBtn");
            const originalText = btn.innerText;
            btn.innerText = "Tersalin!";
            btn.classList.replace("from-blue-600", "from-emerald-600");
            btn.classList.replace("to-indigo-600", "to-teal-600");

            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.replace("from-emerald-600", "from-blue-600");
                btn.classList.replace("to-teal-600", "to-indigo-600");
            }, 1500);
        }

        // Menyalin isi pesan / kode verifikasi tanpa pop-up alert
        function copyMessageContent(textToCopy, buttonElement) {
            navigator.clipboard.writeText(textToCopy);
            
            const originalText = buttonElement.innerText;
            buttonElement.innerText = "Tersalin!";
            buttonElement.className = "bg-emerald-600 text-white text-xs font-bold px-2.5 py-1 rounded transition";

            setTimeout(() => {
                buttonElement.innerText = originalText;
                buttonElement.className = "bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold px-2.5 py-1 rounded transition shadow-sm";
            }, 1500);
        }

        // Mengambil pesan dari Supabase
        async function fetchInbox() {
            if (!currentEmail) return;
            const btn = document.getElementById("refreshBtn");
            btn.innerText = "Memeriksa...";

            let inboxList = document.getElementById("inboxList");

            try {
                let response = await fetch(`${SUPABASE_URL}/rest/v1/emails?recipient=eq.${currentEmail}&order=created_at.desc`, {
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                let messages = await response.json();

                inboxList.innerHTML = "";

                if (messages.length === 0) {
                    inboxList.innerHTML = `<p class="text-sm text-slate-500 text-center py-6">Belum ada email masuk untuk ${currentEmail}</p>`;
                } else {
                    messages.forEach((msg, index) => {
                        let item = document.createElement("div");
                        item.className = "bg-slate-900 border border-slate-800 p-3 rounded-xl shadow-md";
                        
                        // Escape isi body agar aman dimasukkan ke fungsi salin
                        let safeBody = msg.body.replace(/'/g, "\\'");

                        item.innerHTML = `
                            <div class="flex justify-between items-start mb-1">
                                <p class="font-bold text-pink-400 text-xs">Dari: ${msg.sender}</p>
                                <button onclick="copyMessageContent('${safeBody}', this)" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold px-2.5 py-1 rounded transition shadow-sm">Salin Isi</button>
                            </div>
                            <p class="text-xs font-semibold text-yellow-300 mb-1">Subjek: ${msg.subject}</p>
                            <pre class="text-xs text-slate-300 bg-slate-950 p-2.5 rounded border border-slate-800 whitespace-pre-wrap font-sans my-1">${msg.body}</pre>
                            <p class="text-[10px] text-slate-500 text-right mt-1">${new Date(msg.created_at).toLocaleString()}</p>
                        `;
                        inboxList.appendChild(item);
                    });
                }
            } catch (error) {
                console.error("Gagal mengambil data:", error);
                inboxList.innerHTML = `<p class="text-sm text-red-400 text-center py-6">Gagal memuat pesan.</p>`;
            } finally {
                btn.innerText = "Cek Pesan Baru";
            }
        }

        // Generate email default (tipe string) saat pertama kali halaman dibuka
        window.onload = () => generateEmail('string');

        // Auto-refresh cek inbox setiap 10 detik
        setInterval(fetchInbox, 10000);
    </script>
</body>
</html>
