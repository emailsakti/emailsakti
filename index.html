<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sakti - Multiple Domain</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 25px;
            width: 420px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 20px;
        }
        label {
            font-size: 12px;
            font-weight: bold;
            color: #ff7eb3;
            display: block;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .input-group, .select-group {
            margin-bottom: 15px;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        select:focus, input:focus {
            border-color: #58a6ff;
            outline: none;
        }
        .email-box {
            display: flex;
            gap: 8px;
        }
        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
        }
        .btn-copy {
            background-color: #238636;
            color: white;
            padding: 0 15px;
        }
        .btn-copy:hover { background-color: #2ea043; }
        
        .generators {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .btn-gen {
            flex: 1;
            padding: 9px;
            color: white;
        }
        .btn-nama { background: linear-gradient(45deg, #8e44ad, #9b59b6); }
        .btn-string { background: linear-gradient(45deg, #16a085, #1abc9c); }
        .btn-custom { background: linear-gradient(45deg, #d35400, #e67e22); }
        .btn-gen:hover { opacity: 0.9; }

        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .btn-refresh {
            background-color: #1f6feb;
            color: white;
            padding: 5px 12px;
            font-size: 12px;
        }
        .btn-refresh:hover { background-color: #388bfd; }

        .inbox-content {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            height: 120px;
            padding: 10px;
            font-size: 13px;
            color: #8b949e;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>EMAIL SAKTI</h2>
    <div class="subtitle">Layanan Kotak Masuk Multi-Domain</div>

    <!-- Pilihan Domain -->
    <div class="select-group">
        <label>Pilih Domain:</label>
        <select id="domainSelect" onchange="updateEmailDisplay()">
            <option value="caseyroom.biz.id">caseyroom.biz.id</option>
            <option value="kaylaroom.biz.id">kaylaroom.biz.id</option>
            <option value="natalieroom.biz.id">natalieroom.biz.id</option>
            <option value="josjisbos.my.id">josjisbos.my.id</option>
        </select>
    </div>

    <div class="input-group">
        <label>Alamat Email Anda:</label>
        <div class="email-box">
            <input type="text" id="emailInput" readonly value="budi997@caseyroom.biz.id">
            <button class="btn-copy" onclick="copyEmail()">Salin</button>
        </div>
    </div>

    <div class="generators">
        <button class="btn-gen btn-nama" onclick="generateEmail('nama')">👤 Nama</button>
        <button class="btn-gen btn-string" onclick="generateEmail('string')">🔢 String</button>
        <button class="btn-gen btn-custom" onclick="generateCustom()">✏️ Custom</button>
    </div>

    <div class="inbox-header">
        <label style="margin:0;">Kotak Masuk (Inbox)</label>
        <button class="btn-refresh" onclick="checkInbox()">Cek Pesan Baru</button>
    </div>

    <div class="inbox-content" id="inboxBox">
        Belum ada email masuk untuk <span id="currentEmailTarget">budi997@caseyroom.biz.id</span>
    </div>
</div>

<script>
    // Daftar nama acak untuk generator
    const firstNames = ['budi', 'siti', 'agus', 'dewi', 'eko', 'rina', 'joko', 'sri', 'andi', 'mega'];
    
    function getSelectedDomain() {
        return document.getElementById('domainSelect').value;
    }

    function updateEmailDisplay() {
        const domain = getSelectedDomain();
        const currentPrefix = document.getElementById('emailInput').value.split('@')[0];
        const newEmail = currentPrefix + '@' + domain;
        
        document.getElementById('emailInput').value = newEmail;
        document.getElementById('currentEmailTarget').innerText = newEmail;
    }

    function generateEmail(type) {
        const domain = getSelectedDomain();
        let prefix = '';

        if (type === 'nama') {
            const randomName = firstNames[Math.floor(Math.random() * firstNames.length)];
            const randomNum = Math.floor(100 + Math.random() * 900);
            prefix = randomName + randomNum;
        } else if (type === 'string') {
            prefix = 'user_' + Math.random().toString(36.substring(2, 8));
        }

        const fullEmail = prefix + '@' + domain;
        document.getElementById('emailInput').value = fullEmail;
        document.getElementById('currentEmailTarget').innerText = fullEmail;
        document.getElementById('inboxBox').innerText = `Belum ada email masuk untuk ${fullEmail}`;
    }

    function generateCustom() {
        const domain = getSelectedDomain();
        const customName = prompt("Masukkan nama email custom (tanpa @domain):");
        if (customName && customName.trim() !== "") {
            const cleanName = customName.trim().replace(/[^a-zA-Z0-9._]/g, '');
            const fullEmail = cleanName + '@' + domain;
            document.getElementById('emailInput').value = fullEmail;
            document.getElementById('currentEmailTarget').innerText = fullEmail;
            document.getElementById('inboxBox').innerText = `Belum ada email masuk untuk ${fullEmail}`;
        }
    }

    function copyEmail() {
        const emailInput = document.getElementById('emailInput');
        emailInput.select();
        document.execCommand('copy');
        alert('Email berhasil disalin: ' + emailInput.value);
    }

    function checkInbox() {
        const email = document.getElementById('emailInput').value;
        alert('Memeriksa pesan masuk untuk: ' + email + '\n(Belum ada pesan baru)');
    }
</script>

</body>
</html>
