<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox Email Domain Pribadi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white shadow-xl rounded-2xl p-6 w-full max-w-xl">
        <h1 class="text-2xl font-bold text-slate-800 mb-2 text-center">Inbox Domain josjisbos.my.id</h1>
        <p class="text-sm text-slate-500 mb-6 text-center">Masukkan alamat email lengkap Anda di domain ini untuk mengecek pesan masuk.</p>

        <!-- Bagian Input Alamat Email -->
        <div class="mb-6">
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Alamat Email Tujuan:</label>
            <div class="flex gap-2">
                <input type="text" id="targetEmail" placeholder="contoh: admin@josjisbos.my.id" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2 text-slate-700 font-mono text-sm focus:outline-none">
                <button onclick="fetchInbox()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition">Cek</button>
            </div>
        </div>

        <!-- Tombol Refresh & Status -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold text-slate-700">Kotak Masuk (Inbox)</h2>
            <button onclick="fetchInbox()" id="refreshBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-3 py-1.5 rounded-lg transition">Refresh</button>
        </div>

        <!-- Daftar Pesan Masuk -->
        <div id="inboxList" class="space-y-3 max-h-60 overflow-y-auto mb-4 border border-slate-200 rounded-lg p-3 bg-slate-50">
            <p class="text-sm text-slate-400 text-center py-6">Masukkan alamat email di atas lalu klik Cek...</p>
        </div>
    </div>

    <!-- JavaScript untuk koneksi ke Supabase -->
    <script>
        // KREDENSIAL SUPABASE ANDA
        const SUPABASE_URL = "https://leozcdtoagbxuhefypjh.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxlb3pjZHRvYWdieHVoZWZ5cGpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTI3OTUsImV4cCI6MjEwNzAyODc5NX0.W8Gm7H-lQ9CbcvhiZXjV6RK1uNbrKMRgrwDdtda5dgI";

        async function fetchInbox() {
            const email = document.getElementById("targetEmail").value.trim();
            if (!email) {
                alert("Masukkan alamat email terlebih dahulu!");
                return;
            }

            const btn = document.getElementById("refreshBtn");
            btn.innerText = "Memeriksa...";

            let inboxList = document.getElementById("inboxList");
            inboxList.innerHTML = `<p class="text-sm text-slate-400 text-center py-6">Memuat pesan...</p>`;

            try {
                let response = await fetch(`${SUPABASE_URL}/rest/v1/emails?recipient=eq.${email}&order=created_at.desc`, {
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                let messages = await response.json();

                inboxList.innerHTML = "";

                if (messages.length === 0) {
                    inboxList.innerHTML = `<p class="text-sm text-slate-400 text-center py-6">Belum ada email masuk untuk ${email}</p>`;
                } else {
                    messages.forEach(msg => {
                        let item = document.createElement("div");
                        item.className = "bg-white border border-slate-200 p-3 rounded-lg shadow-sm";
                        item.innerHTML = `
                            <p class="font-semibold text-slate-800 text-sm">Dari: ${msg.sender}</p>
                            <p class="text-xs font-bold text-blue-600 mb-1">Subjek: ${msg.subject}</p>
                            <pre class="text-xs text-slate-600 bg-slate-50 p-2 rounded whitespace-pre-wrap font-sans">${msg.body}</pre>
                            <p class="text-[10px] text-slate-400 mt-1 text-right">${new Date(msg.created_at).toLocaleString()}</p>
                        `;
                        inboxList.appendChild(item);
                    });
                }
            } catch (error) {
                console.error("Gagal mengambil data:", error);
                inboxList.innerHTML = `<p class="text-sm text-red-400 text-center py-6">Gagal memuat pesan dari database.</p>`;
            } finally {
                btn.innerText = "Refresh";
            }
        }
    </script>
</body>
</html>
